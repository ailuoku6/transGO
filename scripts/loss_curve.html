<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transformer Go · Loss 曲线</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --text: #222b38; --muted: #657083; --grid: #dce1e8; --line: #177bba; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14181f; --text: #e1e8f0; --muted: #a9b4c3; --grid: #343e4e; --line: #6cbbef; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 1100px; margin: auto; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
    p { margin: 6px 0; }
    .meta, .note { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .plots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin: 24px 0; }
    section { min-width: 0; }
    .wide { grid-column: 1 / -1; }
    .chart { display: block; width: 100%; }
    .chart text { fill: var(--text); font-size: 12px; }
    .chart .grid { stroke: var(--grid); stroke-width: 1; }
    .chart .line { fill: none; stroke: var(--line); stroke-width: 1.8; }
    .chart .point { fill: var(--line); }
    .chart .guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
    .detail { min-height: 24px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    @media (max-width: 640px) { main { padding: 16px 8px; } .plots { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Transformer Go · Loss 曲线</h1>
  <p class="meta" id="metadata"></p>
  <div class="plots" id="plots"></div>
  <p class="note">每个点代表一次已完成训练的整轮均值；重复轮次按不同训练 step 保留。各分项是加权前数值，梯度范数是裁剪前数值。Score Gaussian NLL 可以为负。Loss 变化需结合评测结果判断。</p>
  <p class="meta" id="source"></p>
  <noscript>请启用 JavaScript 显示曲线；本报告的所有数据和绘图代码均已内嵌，无需联网。</noscript>
</main>
<script>
(() => {
  "use strict";
  const data = __LOSS_DATA__;
  const metadata = __LOSS_METADATA__;
  const ns = "http://www.w3.org/2000/svg";
  const number = new Intl.NumberFormat("zh-CN");
  const format = value => Math.abs(value) < 0.02 ? value.toFixed(4) : value.toFixed(3);
  document.getElementById("metadata").textContent =
    `最新训练完成：${metadata.updated}（北京时间） · 第 ${metadata.iteration} 轮 · step ${number.format(metadata.step)} · ${metadata.attempts} 次训练`;
  document.getElementById("source").textContent = `数据源：${metadata.source}`;
  const specifications = [
    { key: "total", title: "总损失 · 已记录历史", wide: true },
    { key: "total", title: `总损失 · 最近 ${Math.min(metadata.recent, data.length)} 次训练`, wide: true, recent: true },
    { key: "policy", title: "Policy · 策略损失" },
    { key: "value", title: "Value · 价值损失" },
    { key: "score", title: "Score · Gaussian NLL" },
    { key: "ownership", title: "Ownership · 棋盘归属损失" },
    { key: "moves", title: "Moves left · 剩余手数损失" },
    { key: "grad_norm", title: "Grad norm · 裁剪前梯度范数" }
  ];

  function element(tag, attributes = {}, label) {
    const node = document.createElementNS(ns, tag);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
    if (label !== undefined) node.textContent = label;
    return node;
  }

  function draw(section, specification, svg, detail) {
    const points = specification.recent ? data.slice(-metadata.recent) : data;
    const width = section.getBoundingClientRect().width;
    if (width < 140) return;
    const height = specification.wide ? 250 : 210;
    const margin = { left: 72, right: 16, top: 16, bottom: 44 };
    const w = width - margin.left - margin.right;
    const h = height - margin.top - margin.bottom;
    const first = points[0].step, last = points[points.length - 1].step;
    const x0 = first === last ? first - 1 : first;
    const x1 = first === last ? last + 1 : last;
    const values = points.map(point => point[specification.key]);
    const min = Math.min(...values), max = Math.max(...values);
    const padding = (max - min || Math.abs(min) || 1) * 0.12;
    const y0 = min - padding, y1 = max + padding;
    const x = step => margin.left + 5 + (step - x0) / (x1 - x0) * (w - 10);
    const y = value => margin.top + h - 5 - (value - y0) / (y1 - y0) * (h - 10);
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("height", height);
    svg.replaceChildren(element("title", {}, specification.title),
      element("desc", {}, `${points.length} 次训练，step ${first} 到 ${last}，最新均值 ${format(values[values.length - 1])}`));
    svg.append(element("rect", { x: margin.left, y: margin.top, width: w, height: h, fill: "none", class: "grid" }));
    for (let i = 0; i < 4; i++) {
      const value = y0 + (y1 - y0) * i / 3;
      const py = y(value);
      svg.append(element("line", { x1: margin.left, x2: margin.left + w, y1: py, y2: py, class: "grid" }));
      svg.append(element("text", { x: margin.left - 8, y: py + 4, "text-anchor": "end" }, format(value)));
    }
    const ticks = width < 500 ? 3 : 5;
    for (let i = 0; i < ticks; i++) {
      const step = x0 + (x1 - x0) * i / (ticks - 1);
      svg.append(element("text", { x: x(step), y: margin.top + h + 19,
        "text-anchor": i === 0 ? "start" : i === ticks - 1 ? "end" : "middle" },
        step >= 1000 ? `${Number((step / 1000).toFixed(1))}k` : String(Math.round(step))));
    }
    svg.append(element("text", { x: margin.left + w / 2, y: height - 4, "text-anchor": "middle" }, "训练步数"));
    svg.append(element("text", { transform: `translate(16 ${margin.top + h / 2}) rotate(-90)`, "text-anchor": "middle" },
      specification.key === "grad_norm" ? "范数均值" : "Loss 均值"));
    const path = points.map((point, i) => `${i ? "L" : "M"}${x(point.step)},${y(point[specification.key])}`).join(" ");
    svg.append(element("path", { d: path, class: "line" }));
    const latest = points[points.length - 1];
    svg.append(element("circle", { cx: x(latest.step), cy: y(latest[specification.key]), r: 3, class: "point" }));
    const guide = element("line", { y1: margin.top, y2: margin.top + h, class: "guide", visibility: "hidden" });
    const marker = element("circle", { r: 4, class: "point", visibility: "hidden" });
    svg.append(guide, marker);
    const latestText = `最新：第 ${latest.iteration} 轮 · step ${number.format(latest.step)} · 均值 ${format(latest[specification.key])}`;
    detail.textContent = latestText;
    const overlay = element("rect", { x: margin.left, y: margin.top, width: w, height: h, fill: "transparent" });
    function inspect(event) {
      const px = (event.clientX - svg.getBoundingClientRect().left) * width / svg.getBoundingClientRect().width;
      const target = x0 + (px - margin.left - 5) / (w - 10) * (x1 - x0);
      let low = 0, high = points.length - 1;
      while (low < high) {
        const middle = Math.floor((low + high) / 2);
        if (points[middle].step < target) low = middle + 1;
        else high = middle;
      }
      const index = low > 0 && Math.abs(points[low - 1].step - target) < Math.abs(points[low].step - target) ? low - 1 : low;
      const selected = points[index];
      guide.setAttribute("x1", x(selected.step)); guide.setAttribute("x2", x(selected.step));
      marker.setAttribute("cx", x(selected.step)); marker.setAttribute("cy", y(selected[specification.key]));
      guide.setAttribute("visibility", "visible"); marker.setAttribute("visibility", "visible");
      detail.textContent = `第 ${selected.iteration} 轮 · step ${number.format(selected.step)} · 均值 ${format(selected[specification.key])}`;
    }
    overlay.addEventListener("pointermove", inspect);
    overlay.addEventListener("pointerdown", inspect);
    overlay.addEventListener("pointerleave", event => {
      if (event.pointerType === "touch") return;
      guide.setAttribute("visibility", "hidden"); marker.setAttribute("visibility", "hidden");
      detail.textContent = latestText;
    });
    svg.append(overlay);
  }

  const plots = document.getElementById("plots");
  const observers = [];
  for (const specification of specifications) {
    const section = document.createElement("section");
    if (specification.wide) section.className = "wide";
    const heading = document.createElement("h2"); heading.textContent = specification.title;
    const svg = element("svg", { class: "chart", role: "img", "aria-label": specification.title });
    const detail = document.createElement("p"); detail.className = "detail";
    section.append(heading, svg, detail); plots.append(section);
    const observer = new ResizeObserver(() => draw(section, specification, svg, detail));
    observer.observe(section); observers.push(observer);
  }
})();
</script>
</body>
</html>
